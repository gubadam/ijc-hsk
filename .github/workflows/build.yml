name: Build Anki decks

on:
  push:
    branches: [main]
    paths: ["decks/**", "templates/**", "media/**", "build.py", "requirements.txt", "tools/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["decks/**", "templates/**", "media/**", "build.py", "requirements.txt", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-decks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history + tags, needed for the changelog

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validate
        if: github.event_name == 'pull_request'
        run: python build.py --check

      - name: Build
        if: github.event_name != 'pull_request'
        run: python build.py ${{ github.ref == 'refs/heads/main' && '--write-guids' || '' }}

      # New words get their GUID stored in the CSV, so later edits to the word
      # itself don't make Anki treat it as a new note.
      - name: Commit new GUIDs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- decks; then echo "No new GUIDs."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fill GUIDs for new words [skip ci]" -- decks
          git push origin HEAD:main

      - name: Changelog since previous release
        id: changelog
        run: |
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          python tools/changelog.py --since "$prev" --output changelog.md
          cat changelog.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          name: anki-decks
          path: dist/*.apkg

      - name: Publish release
        if: >-
          github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
          && (steps.changelog.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d).${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/*.apkg \
            --target "$(git rev-parse HEAD)" \
            --title "$(date -u +%Y-%m-%d) (#${GITHUB_RUN_NUMBER})" \
            --notes-file changelog.md \
            --latest
