<script>
(function () {
  // --- TTS fallback for AnkiWeb (it does not support Anki TTS tags and shows the raw
  //     [anki:tts]…[/anki:tts] text). Desktop/mobile Anki never get here,
  //     because they turn the tags into play buttons before the card renders.
  (function () {
    var TAG = /\[anki:tts([^\]]*)\]([\s\S]*?)\[\/anki:tts\]/g;
    var card = document.querySelector('.card') || document.body;
    var walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) {
      var n = walker.currentNode, tag = n.parentNode && n.parentNode.nodeName;
      if (tag === 'SCRIPT' || tag === 'STYLE') continue;  // incl. this script's own source
      if (n.nodeValue.indexOf('[anki:tts') !== -1) nodes.push(n);
    }
    if (!nodes.length) return;
    var synth = window.speechSynthesis && window.SpeechSynthesisUtterance ? window.speechSynthesis : null;
    var texts = [];

    function speak(text, lang) {
      if (!synth) return;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      var v = synth.getVoices().filter(function (x) { return x.lang.replace('_', '-') === lang; })[0];
      if (v) u.voice = v;
      u.rate = 0.9;
      try { synth.speak(u); } catch (e) { /* speech not available */ }
    }
    function button(text, lang) {
      var a = document.createElement('a');
      a.href = '#'; a.className = 'replay-button soundLink';
      a.innerHTML = '<svg class="playImage" viewBox="0 0 64 64" version="1.1">' +
        '<circle cx="32" cy="32" r="29"></circle>' +
        '<path d="M56.502,32.301l-37.502,20.101l0.329,-40.804l37.173,20.703Z"></path></svg>';
      a.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        if (synth) synth.cancel();
        speak(text, lang);
      });
      if (!synth) a.style.display = 'none';
      return a;
    }

    nodes.forEach(function (node) {
      var text = node.nodeValue, last = 0, m, frag = document.createDocumentFragment();
      TAG.lastIndex = 0;
      while ((m = TAG.exec(text))) {
        var lm = /lang=([A-Za-z_-]+)/.exec(m[1]);
        var lang = (lm ? lm[1] : 'zh_CN').replace('_', '-');
        frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        frag.appendChild(button(m[2], lang));
        texts.push([m[2], lang]);
        last = TAG.lastIndex;
      }
      // drop any stray closing tag left over
      frag.appendChild(document.createTextNode(text.slice(last).replace(/\[\/?anki:tts[^\]]*\]/g, '')));
      node.parentNode.replaceChild(frag, node);
    });

    // autoplay like desktop Anki does (browsers may block it; the buttons still work)
    if (synth) {
      synth.cancel();
      texts.forEach(function (t) { speak(t[0], t[1]); });
    }
  })();

  // --- highlight the word in the sentence and its pinyin ---
  function esc(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
  document.querySelectorAll('[data-hl]:not([data-done])').forEach(function (el) {
    el.setAttribute('data-done', '');
    var w = (el.getAttribute('data-hl') || '').normalize('NFC').replace(/\s+/g, '');
    if (!w) return;
    var re = new RegExp(Array.from(w).map(esc).join('\\s*'), 'giu');
    var walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function (node) {
      var text = node.nodeValue.normalize('NFC'), last = 0, m;
      var frag = document.createDocumentFragment();
      re.lastIndex = 0;
      while ((m = re.exec(text))) {
        if (!m[0]) { re.lastIndex++; continue; }
        frag.appendChild(document.createTextNode(text.slice(last, m.index)));
        var span = document.createElement('span');
        span.className = 'hl'; span.textContent = m[0];
        frag.appendChild(span);
        last = re.lastIndex;
      }
      if (!last) return;
      frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    });
  });

  // --- swap the word for a stroke-order animation (Hanzi Writer) ---
  function initStrokes() {
    var cs = getComputedStyle(document.querySelector('.card') || document.body);
    var fg = cs.getPropertyValue('--fg').trim() || '#222';
    var accent = cs.getPropertyValue('--accent').trim() || '#c0392b';
    var line = cs.getPropertyValue('--line').trim() || '#ddd';

    document.querySelectorAll('[data-strokes]:not([data-done])').forEach(function (el) {
      el.setAttribute('data-done', '');
      var chars = Array.from(el.getAttribute('data-strokes') || '')
        .filter(function (c) { return /\p{Script=Han}/u.test(c); });
      if (!chars.length) return;

      // load data for all characters first; swap only when everything loaded
      Promise.all(chars.map(function (c) { return HanziWriter.loadCharacterData(c); }))
        .then(function (data) {
          el.textContent = '';
          el.classList.add('strokes');
          var writers = chars.map(function (ch, i) {
            var box = document.createElement('div');
            box.className = 'stroke-char';
            el.appendChild(box);
            var w = HanziWriter.create(box, ch, {
              width: 130, height: 130, padding: 8,
              showCharacter: false, showOutline: true,
              strokeColor: fg, radicalColor: accent, outlineColor: line,
              strokeAnimationSpeed: 1.2, delayBetweenStrokes: 200,
              charDataLoader: function (_c, onLoad) { onLoad(data[i]); }
            });
            box.addEventListener('click', function () { w.animateCharacter(); });
            return w;
          });
          (function play(k) {
            if (k >= writers.length) return;
            writers[k].animateCharacter({ onComplete: function () { play(k + 1); } });
          })(0);
        })
        .catch(function () { /* offline or missing character: keep the plain word */ });
    });
  }

  if (!document.querySelector('[data-strokes]')) return;
  if (window.HanziWriter) { initStrokes(); return; }
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/hanzi-writer@3/dist/hanzi-writer.min.js';
  s.onload = initStrokes;
  document.head.appendChild(s);
})();
</script>
